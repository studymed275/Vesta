<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#181b22;--card2:#21252e;--line:#2b303b;--tx:#e9ebf0;--mut:#8b92a1;--acc:#4ade80;--acc2:#22c55e;--blue:#60a5fa;--org:#fb923c;--red:#f87171;--pur:#c084fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:10px 12px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 .r{font-size:13px;font-weight:500;color:var(--mut)}
h3{font-size:14px;margin:14px 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut)}.small{font-size:13px}.c{text-align:center}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;color:var(--tx);font-weight:500}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#05140b;font-weight:650}
.btn.red{color:var(--red)}
.btn.block{display:block;width:100%;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{width:100%;min-height:70px;resize:vertical}
select{-webkit-appearance:none;appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.dayhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.dayhead .dt{flex:1;text-align:center}
.dayhead .dt b{display:block;font-size:19px}
.dayhead .dt small{color:var(--mut)}
.ic{width:42px;height:42px;border-radius:12px;background:var(--card);border:0;font-size:24px;line-height:1;display:grid;place-items:center}
.banner{background:linear-gradient(135deg,#1e3a5f,#1b2a44);border:1px solid #2f5687;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.chip{background:var(--card);border-radius:13px;padding:9px 6px;text-align:center}
.chip small{display:block;color:var(--mut);font-size:11px}
.chip b{font-size:16px}
.chk{width:32px;height:32px;border-radius:9px;border:2px solid #3a4150;background:none;display:grid;place-items:center;flex:none;padding:0}
.chk.on{background:var(--acc2);border-color:var(--acc2)}
.chk.on::after{content:"";width:12px;height:6px;border:3px solid #05140b;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.row .t{font-weight:550}
.row .d{font-size:12.5px;color:var(--mut)}
.kc{font-size:13px;color:var(--mut);white-space:nowrap;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:3px;transition:width .3s}
.tag{font-size:11.5px;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut);font-weight:500}
.tag.g{background:#143b24;color:var(--acc)}.tag.o{background:#43260f;color:var(--org)}.tag.b{background:#16304f;color:var(--blue)}
.ex{background:var(--card2);border-radius:13px;padding:11px;margin-top:10px}
.ex.alldone{outline:1.5px solid #1f6b3c}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exh b{font-size:15px}
.exh small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.wctl{display:flex;align-items:center;gap:4px;flex:none}
.wctl input{width:62px;text-align:center;padding:6px 4px}
.wctl span{font-size:12px;color:var(--mut)}
.st{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;padding:0;display:grid;place-items:center}
.hint{font-size:12.5px;margin-top:7px;padding:6px 9px;border-radius:9px}
.hint.up{background:#143b24;color:var(--acc)}
.hint.inc{background:#16304f;color:var(--blue)}
.hint.dn{background:#43260f;color:var(--org)}
.set{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #2a2f3a}
.set:first-child{border-top:0}
.sets{margin-top:8px}
.sn{width:22px;height:22px;border-radius:50%;background:var(--card);font-size:12px;display:grid;place-items:center;color:var(--mut);flex:none}
.rv{min-width:38px;text-align:center;font-weight:650;font-size:16px}
.sl{flex:1;font-size:12px;color:var(--mut)}
.set.done .rv{color:var(--acc)}
.addset{background:none;border:0;color:var(--mut);font-size:12.5px;padding:6px 0 0}
.tip{font-size:13px;background:var(--card2);border-radius:10px;padding:8px 10px;margin-bottom:8px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:11px;color:var(--mut);padding-bottom:2px}
.cell{aspect-ratio:1/1.12;background:var(--card2);border-radius:10px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border:1.5px solid transparent;font-size:13px}
.cell.empty{background:none}
.cell.pre{opacity:.35}
.cell.today{border-color:var(--acc2)}
.cell.sel{background:#2b3240}
.cell{position:relative}.cell.ok{background:#173322}.okc{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;background:var(--acc2)}.okc::after{content:'';position:absolute;left:4px;top:3.5px;width:6px;height:3.5px;border:2px solid #05140b;border-top:0;border-right:0;transform:rotate(-45deg)}
.car{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.car::-webkit-scrollbar{display:none}.car .sp{flex:0 0 5%}
.opt{flex:0 0 88%;scroll-snap-align:center;background:var(--card2);border-radius:14px;padding:12px;border:1.5px solid transparent}.opt.sel{border-color:var(--acc2)}.opt b{font-size:16px}.opt .ing{font-size:12.5px;color:var(--mut);margin-top:6px}.opt .how{font-size:12.5px;margin-top:6px}
.pdots{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}.pdots i{width:7px;height:7px;border-radius:50%;background:#3a4150}.pdots i.on{background:var(--acc)}
.shop .row{padding:8px 0}.shop .row.got .t{text-decoration:line-through;color:var(--mut)}
.cell .wl{font-size:9.5px;color:var(--mut);letter-spacing:.02em}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dt-t{background:var(--acc)}.dt-m{box-shadow:inset 0 0 0 1.5px var(--red)}.dt-k{background:var(--org)}.dt-kh{background:#7a4a24}.dt-w{background:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.kpi{background:var(--card2);border-radius:12px;padding:10px}
.kpi small{color:var(--mut);font-size:12px;display:block}
.kpi b{font-size:19px}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
svg.chart{width:100%;height:auto;display:block;margin-top:6px}
.gl{stroke:#2a2f3a;stroke-width:1}
.ax{fill:#7d8494;font-size:9.5px}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:4px;flex-wrap:wrap}
.lg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;border-top:0}
td.n,th.n{text-align:right}
/* settings */
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field input{width:120px;text-align:right}
.wdsel{display:flex;gap:5px}
.wdsel button{width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:12px;padding:0}
.wdsel button.on{background:var(--blue);border-color:var(--blue);color:#06121f;font-weight:650}
/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 7px;font-size:11px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.timer{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#16304f;border:1px solid #2f5687;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:11;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.timer.show{display:flex}
.timer.end{background:#143b24;border-color:#1f6b3c}
.timer b{font-size:20px;font-variant-numeric:tabular-nums;flex:1}
.timer button{background:rgba(255,255,255,.08);border:0;border-radius:9px;padding:7px 10px;color:var(--tx)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#2b3240;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
pre.sum{white-space:pre-wrap;font-size:12px;background:var(--card2);border-radius:10px;padding:10px;max-height:300px;overflow:auto;-webkit-user-select:text;user-select:text}
</style>
</head>

};

/* Supplements pro Mahlzeit */

/* Vegetarisch: Ersatz + Makros pro g */
const MAC={poulet:[1.1,.23],planted:[1.51,.24],hack:[2.0,.2],quorn:[1.08,.15],oel:[9,0]};
const VEG={poulet:[['planted',1]],hack:[['quorn',1.2],['oel',.07]]};
const VEGN=[['Chili con Carne','Chili sin Carne (Quorn)'],['Bolognese','Bolognese (Quorn)'],['Poulet-Caprese','planted-Caprese'],['Poulet-Wraps','planted-Wraps'],['Poulet ·','planted.chicken ·']];
function vegOpt(o){let k=o.k,p=o.p;const i=[];o.i.forEach(([id,q])=>{if(!VEG[id]){i.push([id,q]);return}
 k-=MAC[id][0]*q;p-=MAC[id][1]*q;VEG[id].forEach(([nid,f])=>{const nq=Math.round(q*f);k+=MAC[nid][0]*nq;p+=MAC[nid][1]*nq;const ex=i.find(x=>x[0]===nid);if(ex)ex[1]+=nq;else i.push([nid,nq])})});
 const mg={};i.forEach(([id,q])=>mg[id]=(mg[id]||0)+q);i.length=0;Object.keys(mg).forEach(id=>i.push([id,mg[id]]));
 let n=o.n;VEGN.forEach(([a,b])=>n=n.replace(a,b));
 return{...o,n,k:Math.round(k),p:Math.round(p),i,h:o.h.replace(/Poulet/g,'planted').replace(/Hack/g,'Quorn')}}
const EXTRA={n:'Extra-Mahlzeit',k:375,p:18,i:[['milch',200],['brot',70],['kaese',20]],d:'Glas Milch + 2 Scheiben Brot mit Käse'};
const MEAL_IDS=[['fruh','Frühstück (+ Kreatin, Theanin)'],['mitt','Mittag (+ Vit. D, Omega-3)'],['snack','Snack'],['abend','Abend (+ Magnesium)']];
const STRETCH='Dehnen: 3× 1 min hängen · Zehen berühren · Beine seitwärts';

/* ===================== UTIL ===================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const todayKey=()=>key(new Date());
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const wkStart=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return key(d)};
const fmtD=k=>{const d=parse(k);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
const fmtS=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtLong=d=>`${['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`;
const num=v=>{if(v==null)return NaN;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?NaN:n};
const r1=v=>Math.round(v*10)/10;
const r2=v=>Math.round(v*100)/100;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

/* ===================== STATE ===================== */
const LS='bulkTracker_v1';
const DEF={v:2,settings:{start:todayKey(),startW:76,goalW:84,weeks:26,kcal:3000,prot:150,weigh:[1,3,5],rest:90,snus:{on:false,start:todayKey(),from:10,to:0,weeks:8}},days:{},menus:{},shop:{}};
let S=null;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!S.days)S=JSON.parse(JSON.stringify(DEF));
S.settings={...DEF.settings,...S.settings};S.menus=S.menus||{};S.shop=S.shop||{};S.settings.snus={...DEF.settings.snus,...S.settings.snus,on:false};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('⚠️ Speichern fehlgeschlagen')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const peek=k=>S.days[k]||{};
const day=k=>S.days[k]||(S.days[k]={});

let tab='today',planWk=null,cur=todayKey(),calYM=[new Date().getFullYear(),new Date().getMonth()],statEx='bench',sumText='';

/* ===================== LOGIC ===================== */
const workoutOf=k=>peek(k).wo||SCHED[parse(k).getDay()];
const planEx=k=>PLAN[workoutOf(k)].ex;
const exDef=(k,id)=>planEx(k).find(x=>x.id===id)||EX[id];
const hasW=x=>x.t==='kg'||x.t==='add';
function lastSession(id,k){
 const ks=Object.keys(S.days).filter(x=>x<k).sort().reverse();
 for(const kk of ks){const e=S.days[kk].ex&&S.days[kk].ex[id];if(e&&e.sets.some(s=>s.d))return{...e,k:kk}}
 return null}
function dflt(x,k){const l=lastSession(x.id,k);return{w:l?l.w:(x.w||0),sets:Array.from({length:x.s},()=>({r:x.r,d:false}))}}
const entry=(k,x)=>(peek(k).ex&&peek(k).ex[x.id])||dflt(x,k);
function ensure(k){const d=day(k);d.ex=d.ex||{};planEx(k).forEach(x=>{if(!d.ex[x.id])d.ex[x.id]=dflt(x,k)});return d}
function sess(k){const wo=workoutOf(k);if(wo==='rest')return null;let t=0,dn=0;
 planEx(k).filter(x=>!x.warm).forEach(x=>{const e=entry(k,x);t+=e.sets.length;dn+=e.sets.filter(s=>s.d).length});return{t,dn}}
const sessDone=k=>{const s=sess(k);return!!s&&s.dn>0&&s.dn>=Math.ceil(s.t*.5)};
/* ---- Menü / Woche (Sa–Fr) ---- */
const satKey=k=>addDays(k,-((parse(k).getDay()+1)%7));
function getMenu(wk){if(S.menus[wk])return S.menus[wk];const prev=Object.keys(S.menus).filter(x=>x<wk).sort().pop();
 const b=prev?S.menus[prev]:{fruh:0,mitt:0,snack:0,abend:0,extra:false};return{...b,days:7}}
function setMenu(wk,patch){S.menus[wk]={...getMenu(wk),...patch};save()}
const FR={.25:'¼',.33:'⅓',.5:'½',.75:'¾'};
function fmtQ(q,u){if(u==='Stk'){const w=Math.floor(q),f=r2(q-w);return(w?w:'')+(FR[f]||(f?'+'+f:''))||'0'}return u==='ml'&&q>=1000?r1(q/1000)+' l':u==='g'&&q>=1000?r1(q/1000)+' kg':Math.round(q)+' '+u}
const ingTxt=list=>list.map(([id,q])=>ITEMS[id].u==='Stk'?`${fmtQ(q,'Stk')} ${ITEMS[id].sg||ITEMS[id].n}`:`${fmtQ(q,ITEMS[id].u)} ${ITEMS[id].n}`).join(' · ');
const vo=(o,m)=>m.veg?vegOpt(o):o;
const opt=(s,m)=>vo(MENU[s].o[m[s]]||MENU[s].o[0],m);
function mealsFor(k){const m=getMenu(satKey(k));
 return[...SLOTS.map(s=>{const o=opt(s,m);return{id:s,n:`${MENU[s].n.split(' (')[0]}: ${o.n}`,d:ingTxt(o.i),sp:SUPP[s],k:o.k,p:o.p}}),
  {id:'extra',n:m.extra?'Extra-Mahlzeit (eingeplant)':'Extra (optional)',d:EXTRA.d,k:EXTRA.k,p:EXTRA.p,opt:!m.extra}]}
function prepTip(k){const dow=parse(k).getDay(),m=getMenu(satKey(k)),mi=opt('mitt',m).n;
 if(dow===6)return`🛒 Einkaufstag (Liste im Tab «Einkauf»). Danach Meal-Prep: 4 Portionen ${mi} für Sa–Di.`;
 if(dow===2)return`🍳 Heute Abend: 3 Portionen ${mi} für Mi–Fr kochen.`;
 if(dow===5)return`📋 Morgen ist Einkauf – im Tab «Einkauf» die Gerichte für nächste Woche wählen.`;
 return''}
function kcal(k){const d=peek(k),m=d.m||{};return mealsFor(k).reduce((a,x)=>a+(m[x.id]?x.k:0),0)+(num(d.xk)||0)}
function prot(k){const d=peek(k),m=d.m||{};return mealsFor(k).reduce((a,x)=>a+(m[x.id]?x.p:0),0)+(num(d.xp)||0)}
/* Tag komplett: alle Arbeitssätze, alle Pflicht-Mahlzeiten, Gewicht an Wiegetagen */
function dayComplete(k){if(k<S.settings.start||k>todayKey())return false;const d=peek(k),m=d.m||{};
 const s=sess(k);if(s&&s.dn<s.t)return false;
 if(!mealsFor(k).filter(x=>!x.opt).every(x=>m[x.id]))return false;
 if(S.settings.weigh.includes(parse(k).getDay())&&d.wt==null)return false;if(!snusOk(k))return false;return true}
const ateLogged=k=>{const d=peek(k);return Object.values(d.m||{}).some(Boolean)||num(d.xk)>0};
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
function dur(k){const d=peek(k);if(!d.t0)return null;const e=d.t1||d.tl;return e&&e>d.t0?Math.round((e-d.t0)/60000):null}
const fmtDur=m=>m==null?'–':m>=60?`${Math.floor(m/60)} h ${pad(m%60)} min`:`${m} min`;
function clockTxt(t0){const s=Math.max(0,Math.floor((Date.now()-t0)/1000));return`${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}
/* Snus-Ausschleichplan: wöchentlich linear von 'from' auf 'to' */
function snusAllowed(k){const c=S.settings.snus;if(!c.on||k<c.start)return null;const w=Math.floor(diffDays(c.start,k)/7)+1;
 if(w>=c.weeks)return c.to;return Math.max(c.to,Math.ceil(c.from-(c.from-c.to)*w/c.weeks-1e-9))}
const snusUsed=k=>peek(k).sn??null;
function snusOk(k){const a=snusAllowed(k);if(a==null)return true;const u=snusUsed(k);return u!=null&&u<=a}
const e1rm=(w,r)=>w*(1+r/30);
function weights(){return Object.keys(S.days).filter(k=>S.days[k].wt!=null).sort().map(k=>({k,x:+parse(k),y:S.days[k].wt}))}
function avgAround(W,i){const end=W[i].x;const sl=W.filter(p=>p.x<=end&&p.x>end-7*864e5);return avg(sl.map(p=>p.y))}
function rate(W){const last=W.length?W[W.length-1].x:0;const p=W.filter(q=>q.x>last-28*864e5);if(p.length<3)return NaN;
 const mx=avg(p.map(q=>q.x/864e5)),my=avg(p.map(q=>q.y));let n=0,dd=0;p.forEach(q=>{const dx=q.x/864e5-mx;n+=dx*(q.y-my);dd+=dx*dx});return dd?n/dd*7:NaN}
function exHistory(id){const out=[];Object.keys(S.days).sort().forEach(k=>{const e=S.days[k].ex&&S.days[k].ex[id];if(!e)return;const ds=e.sets.filter(s=>s.d);if(!ds.length)return;
 const x=EX[id];const best=hasW(x)&&x.t==='kg'?Math.max(...ds.map(s=>e1rm(e.w,s.r))):null;out.push({k,x:+parse(k),w:e.w,reps:ds.map(s=>s.r),best,max:Math.max(...ds.map(s=>s.r)),tot:ds.reduce((a,s)=>a+s.r,0)})});return out}
const fmtW=(w,x)=>x.t==='add'?(w>0?`+${w} kg`:'Körpergewicht'):`${w} kg`;
const unit=x=>x.t==='time'?' s':'';

/* ===================== RENDER: TODAY ===================== */
function rToday(){
 const k=cur,d=peek(k),dt=parse(k),dow=dt.getDay(),wo=workoutOf(k),P=PLAN[wo],isT=k===todayKey();
 const wk=Math.floor(diffDays(S.settings.start,k)/7)+1;
 const weighDay=S.settings.weigh.includes(dow);
 const st=sess(k),kc=kcal(k),pr=prot(k);
 let h=`<div class="dayhead"><button class="ic" data-a="nav" data-d="-1">‹</button>
 <div class="dt" data-a="tab" data-t="cal"><b>${fmtLong(dt)}</b><small>${wk>0&&wk<=S.settings.weeks?`Woche ${wk} von ${S.settings.weeks}`:fmtD(k)}${isT?' · Heute':''}</small></div>
 <button class="ic" data-a="nav" data-d="1">›</button></div>`;
 if(!isT)h+=`<button class="btn block" style="margin:-4px 0 12px" data-a="today">← Zurück zu heute</button>`;
 if(weighDay&&d.wt==null)h+=`<div class="banner" data-a="focusWt">⚖️ <b>Heute ist Wiegetag.</b> Morgens nüchtern nach dem WC wiegen und unten eintragen.</div>`;
 h+=`<div class="chips">
 <div class="chip"><small>Training</small><b>${st?`${st.dn}/${st.t}`:'Pause'}</b></div>
 <div class="chip"><small>kcal</small><b style="color:${kc>=S.settings.kcal*.9?'var(--acc)':'inherit'}">${kc}</b></div>
 <div class="chip"><small>Protein</small><b>${pr} g</b></div>
 <div class="chip"><small>Gewicht</small><b style="color:${d.wt!=null?'var(--blue)':'inherit'}">${d.wt!=null?d.wt:'–'}</b></div></div>`;
 if(dayComplete(k))h+=`<div class="banner" style="background:linear-gradient(135deg,#143b24,#12301f);border-color:#1f6b3c">✅ <b>Tag komplett!</b> Training, Essen${weighDay?' und Waage':''} erledigt.</div>`;
 const tp=prepTip(k);if(tp)h+=`<div class="tip">${tp}</div>`;
 const wCard=rWeight(k,d,weighDay,dow);
 if(weighDay)h+=wCard;

 return h}

function rSnus(k,d){const a=snusAllowed(k);if(a==null)return'';const u=d.sn??0,c=S.settings.snus,w=Math.floor(diffDays(c.start,k)/7)+1;
 const over=u>a,col=over?'var(--red)':u===a?'var(--org)':'var(--acc)';
 let dots='';for(let i=0;i<Math.max(a,u);i++)dots+=`<i style="width:14px;height:14px;border-radius:4px;display:inline-block;margin:2px;background:${i<u?(i<a?'var(--acc2)':'var(--red)'):'transparent'};box-shadow:inset 0 0 0 1.5px ${i<a?'#3a6b4c':'var(--red)'}"></i>`;
 return`<div class="card"><h2>🫙 Snus <span class="r">Woche ${Math.min(w,c.weeks)} von ${c.weeks}${w>c.weeks?' · Ziel erreicht':''}</span></h2>
 <div class="row" style="padding-top:0"><button class="chk ${d.sn!=null&&!over?'on':''}" data-a="snusZero"></button><div class="grow"><div class="t" style="color:${col}">${u} von ${a} heute</div><div class="d">${over?`${u-a} über dem Limit – morgen wieder im Rahmen bleiben`:a-u>0?`noch ${a-u} erlaubt`:'Limit für heute erreicht'}${d.sn==null?' · Häkchen = heute keinen':''}</div></div>
 <button class="st" data-a="snus" data-d="-1">−</button><button class="st" data-a="snus" data-d="1" style="width:44px">+1</button></div>
 <div style="margin-top:4px">${dots}</div></div>`}
function rWeight(k,d,weighDay,dow){
 return `<div class="card" id="wcard"><h2>⚖️ Waage <span class="tag ${weighDay?'b':''}">${weighDay?'Wiegetag':'optional'}</span></h2>
 <div class="row"><button class="chk ${d.wt!=null?'on':''}" data-a="focusWt"></button><div class="grow"><div class="t">Körpergewicht</div><div class="d">morgens, nüchtern</div></div>

 ${dow===1?`<div class="row"><button class="chk ${d.waist!=null?'on':''}"></button><div class="grow"><div class="t">Bauchumfang</div><div class="d">1× pro Woche, auf Nabelhöhe</div></div>
 <input type="text" inputmode="decimal" data-c="waist" value="${d.waist??''}" placeholder="cm" style="width:84px;text-align:right"></div>`:''}</div>`}

function rWorkout(k,wo,P,st){
 const opts=Object.keys(PLAN).map(w=>`<option value="${w}" ${w===wo?'selected':''}>${PLAN[w].n}</option>`).join('');
 let h=`<div class="card"><h2>🏋️ Training <select data-c="wo" style="font-size:15px;padding:6px 26px 6px 10px">${opts}</select></h2>`;
 if(wo==='rest'){h+=`<p class="mut small" style="margin:4px 0 8px">Ruhetag – Erholung gehört zum Plan. Training verschoben? Oben ein Workout auswählen.</p>`}
 else{const d=peek(k),pc=st.t?st.dn/st.t*100:0;
  if(!d.t0)h+=`<button class="btn pri block" style="margin:0 0 10px" data-a="wStart">▶ Training starten</button>`;
  else if(!d.t1)h+=`<div class="tip" style="display:flex;align-items:center;gap:10px;background:#16304f">⏱<div class="grow">Gestartet ${hm(d.t0)}<br><b id="wclock" data-t0="${d.t0}" style="font-size:18px;font-variant-numeric:tabular-nums">${clockTxt(d.t0)}</b></div><button class="btn ${st.dn>=st.t?'pri':''}" data-a="wEnd">■ Fertig</button></div>`;
  else h+=`<div class="tip">⏱ <b>${fmtDur(dur(k))}</b> im Gym<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="mut small">Start</span><input type="time" data-c="t0" value="${hm(d.t0)}" style="flex:1;min-width:0;padding:5px 6px"><span class="mut small">Ende</span><input type="time" data-c="t1" value="${hm(d.t1)}" style="flex:1;min-width:0;padding:5px 6px"></div></div>`;
  h+=`<div class="bar"><i style="width:${pc}%"></i></div><div class="small mut">${st.dn} von ${st.t} Arbeitssätzen${sessDone(k)?' · <span style="color:var(--acc)">Einheit gezählt ✓</span>':''}</div>`;
  P.ex.forEach(x=>h+=rEx(k,x))}
 h+=`<div class="row" style="margin-top:8px;border-top:1px solid var(--line)"><button class="chk ${peek(k).str?'on':''}" data-a="stretch"></button><div class="grow"><div class="t">Dehnen</div><div class="d">${STRETCH.replace('Dehnen: ','')}</div></div></div></div>`;
 return h}

function rEx(k,x){
 const e=entry(k,x),last=lastSession(x.id,k),W=hasW(x);
 let info=`${x.s}×${x.r}${unit(x)}${x.warm?' · Warm-up':''}`;
 if(last)info+=` · zuletzt ${W?fmtW(last.w,x)+' × ':''}${last.sets.filter(s=>s.d).map(s=>s.r).join('/')}${unit(x)}`;
 const ready=W&&last&&last.sets.every(s=>s.d&&s.r>=x.r+2);
 let hint='';
 if(W&&last&&e.w>last.w)hint=`<div class="hint up">↑ Gewicht erhöht (+${r2(e.w-last.w)} kg ggü. letztem Mal)</div>`;
 else if(W&&last&&e.w<last.w)hint=`<div class="hint dn">↓ Weniger Gewicht als letztes Mal</div>`;
 else if(ready)hint=`<div class="hint inc">💪 Letztes Mal alle Sätze ≥ ${x.r+2} Wdh. → jetzt +${x.inc} kg</div>`;

function rCal(){

 let h=`<div class="card"><div class="calhead"><button class="ic" data-a="calNav" data-d="-1">‹</button><b>${MON[m]} ${y}</b><button class="ic" data-a="calNav" data-d="1">›</button></div><div class="grid">`;
 ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(w=>h+=`<div class="wd">${w}</div>`);
 for(let i=0;i<off;i++)h+=`<div class="cell empty"></div>`;
 let mT=0,mP=0,mOk=0,kcs=[],ws=[];
 for(let dd=1;dd<=n;dd++){const k=key(new Date(y,m,dd)),wo=workoutOf(k),done=sessDone(k),past=k<t,pre=k<start;
  const kc=kcal(k),d=peek(k);let dots='';
  if(wo!=='rest'&&!pre&&k<=t){mP++;if(done)mT++}
  if(done)dots+='<i class="dt-t"></i>';else if(wo!=='rest'&&past&&!pre)dots+='<i class="dt-m"></i>';

 h+=`</div><div class="legend"><span><i style="background:var(--acc)"></i>Training erledigt</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--red)"></i>verpasst</span><span><i style="background:var(--org)"></i>kcal-Ziel</span><span><i style="background:#7a4a24"></i>kcal teilweise</span><span><i style="background:var(--blue)"></i>gewogen</span><span><b style="color:var(--acc)">✓</b> alles erfüllt</span></div></div>`;
 h+=`<div class="card"><h2>Monat ${MON[m]}</h2><div class="kpis">

/* ===================== CHARTS ===================== */
function lineChart(series,o={}){
 const W=340,H=o.h||170,P={l:34,r:10,t:10,b:22};const pts=series.flatMap(s=>s.pts);
 if(!pts.length)return'<p class="mut c small" style="padding:24px 0">Noch keine Daten.</p>';
 let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x));if(x1-x0<6*864e5){const c=(x0+x1)/2;x0=c-3*864e5;x1=c+3*864e5}
 const ys=pts.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);const pd=Math.max((y1-y0)*.12,o.minPad||1);y0-=pd;y1+=pd;
 const X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r),Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
 let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,yy=Y(v).toFixed(1);g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${P.l-4}" y="${+yy+3}" text-anchor="end">${v.toFixed(o.dec??1)}</text>`}
 [x0,(x0+x1)/2,x1].forEach((x,i)=>g+=`<text class="ax" x="${X(x)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}">${fmtS(new Date(x))}</text>`);
 series.forEach(s=>{if(!s.pts.length)return;const d=s.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join('');
  if(s.pts.length>1||!s.dots)g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round" ${s.op?`opacity="${s.op}"`:''}/>`;
  if(s.dots)s.pts.forEach(p=>g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.8" fill="${s.c}"/>`)});
 const lg=series.filter(s=>s.n).map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('');
 return`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg><div class="lg">${lg}</div>`}
function barChart(items,o={}){
 const W=340,H=o.h||150,P={l:30,r:6,t:10,b:20};if(!items.length)return'<p class="mut c small">Noch keine Daten.</p>';
 const mx=Math.max(o.target||0,...items.map(i=>i.v))*1.12||1;const bw=(W-P.l-P.r)/items.length;const Y=v=>P.t+(1-v/mx)*(H-P.t-P.b);
 let g='';for(let i=0;i<=2;i++){const v=mx*i/2,yy=Y(v).toFixed(1);g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${P.l-4}" y="${+yy+3}" text-anchor="end">${o.fmt?o.fmt(v):Math.round(v)}</text>`}
 const every=Math.ceil(items.length/7);
 items.forEach((it,i)=>{const x=P.l+i*bw+bw*.15,h=Math.max(0,Y(0)-Y(it.v));g+=`<rect x="${x.toFixed(1)}" y="${Y(it.v).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${it.c||'var(--acc2)'}"/>`;
  if(i%every===0)g+=`<text class="ax" x="${(x+bw*.35).toFixed(1)}" y="${H-6}" text-anchor="middle">${it.l}</text>`});
 if(o.target)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`;
 return`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`}

function act(a,ds){
 const k=cur;let rr=true;
 switch(a){
  case'tab':tab=ds.t;if(tab==='cal'){const d=parse(cur);calYM=[d.getFullYear(),d.getMonth()]}window.scrollTo(0,0);break;
  case'nav':cur=addDays(cur,+ds.d);break;
  case'today':cur=todayKey();break;
  case'wInc':case'wDec':{const d=ensure(k),x=exDef(k,ds.ex),e=d.ex[ds.ex];e.w=Math.max(0,r2(e.w+(a==='wInc'?1:-1)*x.inc));save();break}
  case'rInc':case'rDec':{const d=ensure(k),x=exDef(k,ds.ex),s=d.ex[ds.ex].sets[ds.i];const step=x.t==='time'?5:1;s.r=Math.max(0,s.r+(a==='rInc'?step:-step));save();break}
  case'setChk':{const d=ensure(k),s=d.ex[ds.ex].sets[ds.i];s.d=!s.d;if(s.d){if(!d.t0&&k===todayKey()){d.t0=Date.now();toast('⏱ Training gestartet')}d.tl=Date.now()}save();if(s.d&&!exDef(k,ds.ex).warm)startTimer();break}
  case'addSet':{const d=ensure(k),e=d.ex[ds.ex];const l=e.sets[e.sets.length-1];e.sets.push({r:l?l.r:exDef(k,ds.ex).r,d:false});save();break}
  case'rmSet':{const d=ensure(k),e=d.ex[ds.ex];if(e.sets.length>1)e.sets.pop();save();break}
  case'wStart':{const d=day(k);d.t0=k===todayKey()?Date.now():+parse(k)+18*3600e3;delete d.t1;save();break}
  case'wEnd':{const d=day(k);d.t1=Date.now();if(k!==todayKey())d.t1=Math.max(d.t0+60000,d.tl||d.t0+3600e3);save();toast('✅ Training: '+fmtDur(dur(k)));break}
  case'snus':{const d=day(k);d.sn=Math.max(0,(d.sn??0)+ +ds.d);save();break}
  case'snusZero':{const d=day(k);if(d.sn==null)d.sn=0;save();break}
  case'snusOn':S.settings.snus.on=!S.settings.snus.on;save();break;
  case'stretch':{const d=day(k);d.str=!d.str;save();break}
  case'meal':{const d=day(k);d.m=d.m||{};d.m[ds.m]=!d.m[ds.m];save();break}
  case'focusWt':{const el=$('#wtIn');if(el){el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}rr=false;break}
  case'calNav':{let[y,m]=calYM;m+=+ds.d;if(m<0){m=11;y--}if(m>11){m=0;y++}calYM=[y,m];break}
  case'calDay':cur=ds.k;tab='today';window.scrollTo(0,0);break;
  case'mkSum':sumText=summary();copy(sumText);break;
  case'copySum':copy(sumText);rr=false;break;
  case'shareJson':S.settings.lastBackup=todayKey();save();share(`vesta-backup-${todayKey()}.json`,JSON.stringify(S,null,1),'application/json');break;
  case'shareCsv':share(`vesta-daten-${todayKey()}.csv`,'﻿'+csv(),'text/csv');rr=false;break;
  case'imp':$('#fileIn').click();rr=false;break;
  case'wday':{const i=+ds.d,w=S.settings.weigh;S.settings.weigh=w.includes(i)?w.filter(x=>x!==i):[...w,i];save();break}
  case'reset':if(confirm('Wirklich ALLE Daten löschen? Vorher ein Backup machen!')){S=JSON.parse(JSON.stringify(DEF));save();cur=todayKey();toast('Daten gelöscht')}break;
  case'pwk':planWk=addDays(planWk,+ds.d);break;
  case'popt':{const y=window.scrollY;setMenu(planWk,{[ds.s]:+ds.i});render();window.scrollTo(0,y);rr=false;break}
  case'pveg':setMenu(planWk,{veg:!getMenu(planWk).veg});break;
  case'pextra':setMenu(planWk,{extra:!getMenu(planWk).extra});break;
  case'pdays':{const n=Math.min(14,Math.max(1,(getMenu(planWk).days||7)+ +ds.d));setMenu(planWk,{days:n});break}
  case'shopChk':{const g=S.shop[planWk]=S.shop[planWk]||{};g[ds.i]=!g[ds.i];save();break}
  case'shopReset':S.shop[planWk]={};save();break;
  case'shopCopy':copy(shopText(planWk));rr=false;break;
  case'timerStop':clearInterval(tmr);tmr=null;$('#timer').className='timer';rr=false;break;
  case't30':tEnd+=30000;tick();rr=false;break;
 }
 if(rr){const y=window.scrollY;render();if(tab==='plan'&&a!=='pwk'&&a!=='tab')window.scrollTo(0,y)}}
function chg(c,el){
 const k=cur,v=el.value.trim();let rr=true;
 const setNum=(obj,f)=>{const n=num(v);if(v===''||isNaN(n))delete obj[f];else obj[f]=r2(n)};
 switch(c){
  case'wo':{const d=day(k);const had=d.ex&&Object.values(d.ex).some(e=>e.sets.some(s=>s.d));if(had&&!confirm('Workout wechseln? Die heute abgehakten Sätze werden zurückgesetzt.')){break}d.wo=v===SCHED[parse(k).getDay()]?undefined:v;d.ex={};save();break}
  case'wt':setNum(day(k),'wt');save();if(peek(k).wt!=null)toast('⚖️ Gewicht gespeichert');break;

/* ===================== ICON (Vesta: Flamme über V) ===================== */
function drawIcon(size){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
 const bg=g.createLinearGradient(0,0,size,size);bg.addColorStop(0,'#1e3a8a');bg.addColorStop(.55,'#0f1d4a');bg.addColorStop(1,'#060b1f');
 g.fillStyle=bg;g.fillRect(0,0,size,size);
 const gl=g.createRadialGradient(size*.3,size*.2,0,size*.3,size*.2,size*.8);gl.addColorStop(0,'rgba(120,160,255,.18)');gl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gl;g.fillRect(0,0,size,size);
 const sc=size*0.66/1800;g.translate(size/2,size/2);g.scale(sc,sc);g.translate(-965,-1000);
 g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=60;g.shadowOffsetY=25;
 g.strokeStyle='#ffffff';g.lineWidth=105;g.lineCap='round';g.lineJoin='round';
 g.beginPath();g.moveTo(200,1110);g.lineTo(520,1110);g.lineTo(965,1795);g.lineTo(1410,1110);g.lineTo(1730,1110);g.stroke();
 g.beginPath();g.moveTo(700,870);g.lineTo(965,1282);g.lineTo(1230,870);g.stroke();
 g.beginPath();g.moveTo(950,190);g.bezierCurveTo(875,250,855,350,960,490);g.bezierCurveTo(1065,630,1045,730,985,780);g.stroke();
 return c.toDataURL('image/png')}
